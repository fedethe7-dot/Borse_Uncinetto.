<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8E2F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Borse">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Le borse della mamma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: one calm column, big tap targets, tab bar fixed at the bottom; the "stitch" dashed line is the only ornament. */
:root{
  --bg:#F5F2F6; --surface:#FFFFFF; --surface-2:#EEE8F0; --line:#DDD3E0;
  --ink:#2B2230; --ink-2:#5B4F63; --muted:#7D7184;
  --accent:#8E2F5E; --accent-ink:#FFFFFF; --accent-soft:#F4E4EC;
  --good:#2C7A4B; --good-soft:#E2F1E7; --warn:#8F5200; --warn-soft:#FBEFD9; --danger:#B3261E; --danger-soft:#FBE5E3;
  --inc:#2A6BB0; --spe:#C8711C;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
  --r:16px;
  --frame:#6B4433; --frame-2:#8A5C47; --paper:#FFF8E8; --paper-line:#D9C8A6; --paper-ink:#8E2F5E;
  --f-hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18141B; --surface:#221D26; --surface-2:#2D2732; --line:#3B3341;
  --ink:#F3EDF5; --ink-2:#CDC2D2; --muted:#A196A7;
  --accent:#E58DB7; --accent-ink:#2B0F1E; --accent-soft:#3B2332;
  --good:#72C795; --good-soft:#1E3327; --warn:#E8B460; --warn-soft:#3A2E19; --danger:#FF8F86; --danger-soft:#3D1F1D;
  --inc:#5C93D6; --spe:#C8711C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18141B; --surface:#221D26; --surface-2:#2D2732; --line:#3B3341;
  --ink:#F3EDF5; --ink-2:#CDC2D2; --muted:#A196A7;
  --accent:#E58DB7; --accent-ink:#2B0F1E; --accent-soft:#3B2332;
  --good:#72C795; --good-soft:#1E3327; --warn:#E8B460; --warn-soft:#3A2E19; --danger:#FF8F86; --danger-soft:#3D1F1D;
  --inc:#5C93D6; --spe:#C8711C; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;padding:0 16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

/* header */
.top{padding-block:18px 14px;position:relative}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
.top h1{font-family:var(--f-display);font-weight:800;font-size:1.65rem;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.stitch{height:4px;margin-top:14px;background-image:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 18px);border-radius:4px;opacity:.55}

main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.sec-head{display:flex;flex-direction:column;gap:2px;margin:20px 0 14px}
.sec-head h2{font-family:var(--f-display);font-weight:800;font-size:1.4rem;margin:0}
.hint{color:var(--muted);margin:0;font-size:.95rem}
h3.group{font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--ink-2);margin:22px 0 8px;letter-spacing:.02em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:60px;font-size:1.1rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.small{min-height:44px;padding:0 14px;font-size:.95rem}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn:active{transform:translateY(1px)}

/* model cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}
.mcard{display:flex;gap:14px;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%}
.photo{flex:none;width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.empty{background-image:radial-gradient(circle at 50% 50%,transparent 5px,var(--line) 6px,var(--line) 7px,transparent 8px);background-size:22px 22px}
.photo.empty span{font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--accent);background:var(--surface-2);border-radius:50%;width:48px;height:48px;display:grid;place-items:center}
.mbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.mname{font-family:var(--f-display);font-weight:600;font-size:1.12rem;line-height:1.2}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;color:var(--ink-2)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.kv .pos{color:var(--good)} .kv .neg{color:var(--danger)}

/* list rows */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 14px}
.row .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:700;line-height:1.25}
.row .s{color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.row .amt{font-family:var(--f-display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.02em}
.chip.ready{background:var(--warn-soft);color:var(--warn)}
.chip.sold{background:var(--good-soft);color:var(--good)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin:16px 0}
.seg button{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:46px;padding:0 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:700;color:var(--ink-2)}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

.empty-box{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.95rem;color:var(--ink-2)}

/* stats */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hero .big{grid-column:1/-1}
.stat .lab{font-size:.85rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.stat .val{font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.15}
.stat.big .val{font-size:2.3rem}
.stat .val.pos{color:var(--good)} .stat .val.neg{color:var(--danger)}
.stat .foot{font-size:.85rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .val{font-size:1.35rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card h3{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0 0 4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--ink-2);margin:6px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox text{font-family:var(--f-body);fill:var(--muted);font-size:13px}
.chartbox .hit{fill:transparent;cursor:pointer}
.chartbox .hit.on{fill:var(--surface-2)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:.9rem;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums}
.tip b{display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:.85rem}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;min-height:44px}
.rank{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .top{display:flex;justify-content:space-between;gap:10px;font-weight:700;padding:0}
.rank .s{color:var(--muted);font-size:.9rem}
.rank .top span:last-child{white-space:nowrap;color:var(--ink-2)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;border-radius:12px;font-size:.78rem;padding:0;font-weight:700;color:var(--muted)}
.tabs button svg{width:26px;height:26px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(20,10,20,.45)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,.field > .lab{font-weight:700}
.field .help{color:var(--muted);font-size:.88rem}
.in-text{min-height:54px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);width:100%}
textarea.in-text{padding:12px 14px;min-height:84px}
.in-text:focus{border-color:var(--accent);outline:none}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money .in-text{padding-left:34px;font-weight:700;font-size:1.15rem}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:700;line-height:1;flex:none}
.stepper output{min-width:56px;text-align:center;font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.matrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.matrow .line1{display:flex;gap:8px;align-items:center}
.matrow select{flex:1;min-width:0}
.matrow .line2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.matrow .sub{color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.x{width:44px;height:44px;border-radius:10px;border:0;background:var(--surface-2);font-size:1.3rem;flex:none}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.calc .kv{font-size:1rem}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .photo{width:110px;height:110px}
.pick-list{display:flex;flex-direction:column;gap:10px}
.pick{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:left;width:100%}
.pick .photo{width:64px;height:64px}
.pick .photo.empty span{width:36px;height:36px;font-size:1.3rem}
.confirm{background:var(--danger-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;min-height:48px;font-weight:700}
.check input{width:24px;height:24px;accent-color:var(--accent)}
@media (max-width:380px){.tiles{grid-template-columns:1fr 1fr}.photo{width:80px;height:80px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* vetrina: wooden shop window, paper price tags */
.window{margin-top:16px;border-radius:14px;padding:10px;background:linear-gradient(135deg,var(--frame-2),var(--frame));box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.vetrina{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:18px 12px;background:var(--surface-2);border-radius:6px;padding:12px;position:relative;overflow:hidden}
.vetrina::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 60%,rgba(255,255,255,.12) 70%,rgba(255,255,255,0) 78%)}
.vcard{position:relative;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.vimg{display:block;width:100%;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--surface);box-shadow:0 6px 14px rgba(0,0,0,.18);max-width:100%}
.vimg img{width:100%;height:100%;object-fit:cover;display:block}
.nofoto{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);font-size:.9rem;padding:8px;border:2px dashed var(--line);border-radius:6px}
.vname{font-weight:700;font-size:.98rem;line-height:1.2;color:var(--ink)}
.tag{position:absolute;right:-4px;top:calc(min(100%,100%) * 0);margin-top:58%;transform:rotate(-7deg);background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);padding:4px 12px 2px 22px;clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%);box-shadow:0 3px 6px rgba(0,0,0,.2);z-index:1}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--paper-line)}
.tp{font-family:var(--f-hand);font-weight:700;font-size:1.65rem;line-height:1;white-space:nowrap}
.vbig{position:relative;margin-bottom:18px;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--frame-2),var(--frame))}
.vbig .vimg{aspect-ratio:1/1;border-radius:6px}
.vbig.small .vimg{aspect-ratio:4/3}
.vbig .tag.big{margin:0;top:auto;bottom:26px;right:4px;padding:6px 18px 4px 30px;clip-path:polygon(20px 0,100% 0,100% 100%,20px 100%,0 50%)}
.vbig .tag.big::before{left:13px;width:9px;height:9px;margin-top:-4.5px;background:var(--bg)}
.vbig .tag.big .tp{font-size:2.6rem}
.remind{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;margin-top:16px;font-weight:700}
.btn[disabled]{opacity:.6}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="var(--accent)"/><path d="M8 18c8 2 20 2 28-4M7 25c10 3 22 1 30-6M10 32c8 1 18-1 24-8M18 5c-2 10 0 24 8 34" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" opacity=".75"/><path d="M36 30c3 4 5 7 4 10" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div><h1 id="labName">Le borse della mamma</h1><p class="sub">Modelli, materiali e conti</p></div>
    </div>
    <div class="stitch"></div>
  </header>
  <main id="app"><p class="loading">Sto aprendo il quaderno…</p></main>
</div>

<nav class="tabs" aria-label="Sezioni"><div class="in">
  <button data-tab="vetrina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9c0 1.5 1.3 2.5 3 2.5S9 10.5 9 9c0 1.5 1.3 2.5 3 2.5s3-1 3-2.5c0 1.5 1.3 2.5 3 2.5s3-1 3-2.5"/><path d="M5 11.5V20h14v-8.5"/><path d="M10 20v-5h4v5"/></svg>Vetrina</button>
  <button data-tab="borse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M8.5 9a3.5 4 0 0 1 7 0"/></svg>Borse</button>
  <button data-tab="materiali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="12" r="7"/><path d="M5.5 9.5c4 .5 8 0 11-2M5 14c5 1 9 0 12-3M8 18c3 0 7-2 9-5M18 17c2 1 3 2 3 4"/></svg>Materiali</button>
  <button data-tab="vendite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 12 20l-8-8V4h8z"/><circle cx="8" cy="8" r="1.5"/></svg>Vendite</button>
  <button data-tab="conti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Conti</button>
</div></nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" data-act="close"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div id="sheetBody"></div></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileFoto" accept="image/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(Math.round((n||0)*100)/100);
const eur0=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s|€/g,'').replace(',','.'));return isFinite(n)?n:0};

/* ---------- IndexedDB: dati principali + copie automatiche ---------- */
const IDB=(()=>{
  let p=null;
  function open(){if(!p)p=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('borse-della-mamma',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return p}
  const tx=(m,f)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv',m);const rq=f(t.objectStore('kv'));t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())};
})();

function apply(d){
  COLLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[]);
  if(d.imp)S.imp=Object.assign({},S.imp,d.imp);
  updatedAt=num(d.updatedAt);
}
function snapshot(){return {materiali:S.materiali,modelli:S.modelli,lavori:S.lavori,spese:S.spese,imp:S.imp,updatedAt}}

async function loadState(){
  let d=null;
  try{d=await IDB.get('stato')}catch(e){}
  if(!d){try{d=JSON.parse(localStorage.getItem(LK)||'null')}catch(e){}}
  if(!d)d={materiali:DEF.materiali,modelli:DEF.modelli,lavori:[],spese:[],imp:S.imp,updatedAt:0};
  apply(d);await writeState();await refreshCopie();
}
async function writeState(){
  const snap=snapshot();
  try{await IDB.set('stato',snap);try{localStorage.removeItem(LK)}catch(e){}}
  catch(e){try{localStorage.setItem(LK,JSON.stringify(snap))}catch(x){toast('Memoria del telefono piena: togli qualche foto')}}
}
async function autoBackup(){
  try{
    await IDB.set('copia-'+today(),snapshot());
    const ks=(await IDB.keys()).map(String).filter(k=>k.startsWith('copia-')).sort();
    while(ks.length>7)await IDB.del(ks.shift());
    await refreshCopie();
  }catch(e){}
}
async function refreshCopie(){try{copie=(await IDB.keys()).map(String).filter(k=>k.startsWith('copia-')).sort().reverse()}catch(e){copie=[]}}
let wq=Promise.resolve();
function saveLocal(){updatedAt=Date.now();wq=wq.then(writeState).then(autoBackup).catch(()=>{})}

async function put(c,o,quiet){
  const i=S[c].findIndex(x=>x.id===o.id);
  if(i>=0)S[c][i]=o;else S[c].push(o);
  if(!quiet)render();saveLocal();
}
async function del(c,id){S[c]=S[c].filter(x=>x.id!==id);render();saveLocal()}
async function putImp(o,quiet){S.imp=Object.assign({},S.imp,o);if(!quiet)render();saveLocal()}

  document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);

function csvMovimenti(){
  const q=v=>{v=v==null?'':String(v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const n=v=>String(Math.round(num(v)*100)/100).replace('.',',');
  const righe=[];
  S.lavori.forEach(l=>{
    if(l.stato==='venduta')righe.push([l.dataVendita||'','Vendita',l.nome,'1',n(l.prezzo),n(l.costo),n(num(l.prezzo)-num(l.costo)),l.cliente||'']);
    else righe.push([l.dataFine||'','Da vendere',l.nome,'1',n(l.listino),n(l.costo),'','']);
  });
  S.spese.forEach(s=>righe.push([s.data||'','Acquisto materiale',s.nome,fq(num(s.quantita))+' '+(s.unita||''),n(s.totale),'','','']));
  righe.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
  righe.forEach(r=>{if(r[0]){const p=r[0].split('-');r[0]=p[2]+'/'+p[1]+'/'+p[0]}});
  const testa=['Data','Tipo','Descrizione','Quantità','Importo €','Costo materiali €','Guadagno €','Cliente'];
  return '﻿'+[testa].concat(righe).map(r=>r.map(q).join(';')).join('\r\n');
}

const eurTag=v=>{const n=num(v);return '€ '+(Math.round(n)===n?String(n):n.toFixed(2).replace('.',','))};
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function cartolina(m){
  try{await Promise.all(['700 120px Caveat','800 60px "Bricolage Grotesque"','400 36px "Atkinson Hyperlegible"'].map(f=>document.fonts.load(f)))}catch(e){}
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#F5F2F6';x.fillRect(0,0,W,H);
  // cornice della vetrina
  x.fillStyle='#6B4433';rr(x,40,40,1000,1000,22);x.fill();
  x.save();rr(x,64,64,952,952,10);x.clip();
  if(m.foto){const im=await loadImg(m.foto);const s=Math.max(952/im.width,952/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,64+(952-w)/2,64+(952-h)/2,w,h)}
  else{x.fillStyle='#EEE8F0';x.fillRect(64,64,952,952)}
  const g=x.createLinearGradient(64,64,700,700);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.35,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(64,64,952,952);
  x.restore();
  // cartellino
  const tx=640,ty=780;
  x.save();x.translate(tx+170,ty+90);x.rotate(-6*Math.PI/180);x.translate(-170,-90);
  x.strokeStyle='#3A2A1E';x.lineWidth=3;x.beginPath();x.moveTo(40,90);x.bezierCurveTo(10,20,60,-60,140,-150);x.stroke();
  x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=24;x.shadowOffsetY=10;
  x.fillStyle='#FFF8E8';x.beginPath();x.moveTo(60,0);x.lineTo(340,0);x.lineTo(340,180);x.lineTo(60,180);x.lineTo(0,120);x.lineTo(0,60);x.closePath();x.fill();
  x.shadowColor='transparent';x.strokeStyle='#D9C8A6';x.lineWidth=2;x.stroke();
  x.fillStyle='#F5F2F6';x.beginPath();x.arc(40,90,12,0,Math.PI*2);x.fill();x.strokeStyle='#C7B48D';x.stroke();
  x.fillStyle='#8E2F5E';x.font='700 112px Caveat, cursive';x.textAlign='center';x.textBaseline='middle';x.fillText(eurTag(m.prezzo),195,98);
  x.restore();
  // testi
  x.textAlign='left';x.textBaseline='alphabetic';
  x.fillStyle='#2B2230';x.font='800 64px "Bricolage Grotesque", sans-serif';
  const nome=m.nome||'';let fs=64;while(x.measureText(nome).width>1000&&fs>36){fs-=4;x.font='800 '+fs+'px "Bricolage Grotesque", sans-serif'}
  x.fillText(nome,40,1140);
  x.fillStyle='#5B4F63';x.font='400 38px "Atkinson Hyperlegible", sans-serif';x.fillText('Fatta a mano all\'uncinetto',40,1200);
  x.fillStyle='#8E2F5E';x.font='700 38px "Atkinson Hyperlegible", sans-serif';x.fillText(S.imp.nome||'Le borse della mamma',40,1270);
  return new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',.9));
}

function stats(){
  const vend=S.lavori.filter(l=>l.stato==='venduta'&&inPer(l.dataVendita));
  const inc=vend.reduce((t,l)=>t+num(l.prezzo),0);
  const spe=S.spese.filter(s=>inPer(s.data)).reduce((t,s)=>t+num(s.totale),0);
  const marg=vend.reduce((t,l)=>t+num(l.prezzo)-num(l.costo),0);
  const ore=vend.reduce((t,l)=>t+num(l.ore),0);
  const fin=S.lavori.filter(l=>inPer(l.dataFine)).length;
  const pr=S.lavori.filter(l=>l.stato!=='venduta');
  const rank={};vend.forEach(l=>{const k=l.modelloId||l.nome;const r=rank[k]||(rank[k]={nome:l.nome,n:0,inc:0,marg:0});r.n++;r.inc+=num(l.prezzo);r.marg+=num(l.prezzo)-num(l.costo)});
  return {inc,spe,gua:inc-spe,marg,ore,fin,nv:vend.length,npr:pr.length,vpr:pr.reduce((t,l)=>t+num(l.listino),0),rank:Object.values(rank).sort((a,b)=>b.n-a.n||b.inc-a.inc)};
}
function months(){
  const d=new Date();const out=[];
  for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const k=x.getFullYear()+'-'+pad(x.getMonth()+1);
    out.push({k,lab:MESI[x.getMonth()],full:MESI[x.getMonth()]+' '+x.getFullYear(),
      inc:S.lavori.filter(l=>l.stato==='venduta'&&(l.dataVendita||'').slice(0,7)===k).reduce((t,l)=>t+num(l.prezzo),0),
      spe:S.spese.filter(s=>(s.data||'').slice(0,7)===k).reduce((t,s)=>t+num(s.totale),0)})}
  return out;
}
function niceMax(v){if(v<=0)return 50;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10]){if(m*p>=v)return m*p}return 10*p}
function chartSVG(ms){
  const W=600,H=230,pl=44,pr=8,pt=22,pb=30,ih=H-pt-pb,gw=(W-pl-pr)/ms.length;
  const max=niceMax(Math.max(...ms.map(m=>Math.max(m.inc,m.spe))));
  const y=v=>pt+ih-(v/max)*ih;const bw=Math.min(26,gw*.3);
  const bar=(x,v,col)=>{if(v<=0)return'';const h=Math.max(2,(v/max)*ih),r=Math.min(4,h/2,bw/2),yy=pt+ih-h;
    return `<path d="M${x},${pt+ih}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${pt+ih}Z" fill="${col}"/>`};
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${eur0(v).replace(/\s?€/,'')}</text>`}
  let b='',hits='',lab='';
  ms.forEach((m,i)=>{const cx=pl+gw*i+gw/2,x1=cx-bw-1,x2=cx+1;
    hits+=`<rect class="hit" data-i="${i}" x="${pl+gw*i+2}" y="${pt-10}" width="${gw-4}" height="${ih+10}" rx="8"/>`;
    b+=bar(x1,m.inc,'var(--inc)')+bar(x2,m.spe,'var(--spe)');
    lab+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${m.lab}</text>`;
    if(i===ms.length-1){if(m.inc>0)lab+=`<text x="${x1+bw/2}" y="${y(m.inc)-6}" text-anchor="middle" style="fill:var(--ink-2);font-weight:700">${eur0(m.inc).replace(/\s?€/,'')}</text>`;
      if(m.spe>0)lab+=`<text x="${x2+bw/2}" y="${y(m.spe)-6}" text-anchor="middle" style="fill:var(--ink-2);font-weight:700">${eur0(m.spe).replace(/\s?€/,'')}</text>`}
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Incassi e spese degli ultimi sei mesi">${g}${hits}<g style="pointer-events:none">${b}${lab}</g><line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--muted)" stroke-width="1"/></svg>`;
}

function wireChart(){
  const box=$('#chart');if(!box)return;const tip=$('#tip');
  const show=el=>{box.querySelectorAll('.hit').forEach(h=>h.classList.toggle('on',h===el));const m=MS[+el.dataset.i];
    tip.innerHTML=`<b>${m.full}</b>Incassi ${eur(m.inc)}<br>Spese ${eur(m.spe)}`;tip.hidden=false;
    const r=el.getBoundingClientRect(),br=box.getBoundingClientRect();let x=r.left-br.left+r.width/2;x=Math.max(70,Math.min(br.width-70,x));tip.style.left=x+'px';tip.style.top=(r.top-br.top+6)+'px'};
  box.querySelectorAll('.hit').forEach(h=>{h.addEventListener('pointerenter',()=>show(h));h.addEventListener('click',()=>show(h))});
  box.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){tip.hidden=true;box.querySelectorAll('.hit').forEach(h=>h.classList.remove('on'))}});
}

  openSheet(`<h2 id="sheetTitle">${esc(l.nome)}</h2>
  <p style="margin:-6px 0 16px"><span class="chip ${sold?'sold':'ready'}">${sold?'Venduta':'Da vendere'}</span></p>
  <div class="field"><label for="fFine">Finita il</label><input class="in-text" type="date" id="fFine" value="${esc(l.dataFine||'')}"></div>
  ${sold?`<div class="field"><label for="fPrezzo">Venduta a</label>${money('fPrezzo',l.prezzo)}</div>
  <div class="field"><label for="fCli">A chi</label><input class="in-text" id="fCli" value="${esc(l.cliente||'')}"></div>
  <div class="field"><label for="fData">Venduta il</label><input class="in-text" type="date" id="fData" value="${esc(l.dataVendita||'')}"></div>`
  :`<div class="field"><label for="fList">Prezzo</label>${money('fList',l.listino)}</div>`}
  <div class="actions"><button class="btn primary big" data-act="saveLav">Salva</button>
  ${sold?`<button class="btn" data-act="unsell">Non è più venduta</button>`:`<button class="btn good" data-act="vendi" data-id="${esc(l.id)}">Venduta</button>`}
  <button class="btn ghost" data-act="close">Annulla</button>
  <button class="btn danger" data-act="cfAsk">Elimina</button>${confirmBox('Eliminare questa borsa dall\'elenco?','delLav',l.id)}</div>`);
}

/* ---------- photo ---------- */
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const M=900,s=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
$('#fileFoto').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';const cb=photoCb;photoCb=null;if(!f||!cb)return;
  try{cb(await shrink(f))}catch(err){toast('Non riesco ad aprire questa foto')}});

/* ---------- backup ---------- */
$('#fileImport').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(err){toast('Questo file non è una copia valida');return}
  if(!d||!COLLS.some(c=>Array.isArray(d[c]))){toast('Questo file non è una copia valida');return}
  openSheet(`<h2 id="sheetTitle">Caricare la copia?</h2><p>Aggiunge e aggiorna borse, materiali, acquisti e vendite contenuti nel file. Le voci che hai già e non sono nel file restano.</p>
  <div class="actions"><button class="btn primary big" data-act="doImport">Sì, carica</button><button class="btn ghost" data-act="close">Annulla</button></div>`);
  pendingImport=d;});
let pendingImport=null;
async function doImport(){const d=pendingImport;pendingImport=null;closeSheet();toast('Sto caricando…');
  for(const c of COLLS){if(!Array.isArray(d[c]))continue;for(const o of d[c]){if(o&&o.id)await put(c,o,true)}}
  if(d.imp)await putImp(d.imp);render();toast('Copia caricata')}

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('.tabs button');
  if(tb){UI.tab=tb.dataset.tab;try{sessionStorage.setItem('bm-tab',UI.tab)}catch(x){}render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  switch(a){
  case 'close':closeSheet();break;
  case 'cfAsk':{const c=$('#cf');c.hidden=false;b.hidden=true;c.scrollIntoView({block:'nearest',behavior:'smooth'});break}
  case 'cfNo':{$('#cf').hidden=true;const k=document.querySelector('[data-act="cfAsk"]');if(k)k.hidden=false;break}
  case 'seg':UI.vend=b.dataset.v;render();break;
  case 'per':UI.per=b.dataset.v;render();break;
  case 'table':UI.table=!UI.table;render();break;
  /* models */
  case 'newMod':draft={kind:'mod',isNew:true,id:uid('mod'),nome:'',foto:'',ore:4,prezzo:'',note:'',materiali:[]};modForm();break;
  case 'editMod':{const m=mod(id);if(!m)return;draft=Object.assign({kind:'mod',isNew:false},JSON.parse(JSON.stringify(m)));draft.materiali=draft.materiali||[];modForm();break}
  case 'addRow':{readMod();const used=new Set(draft.materiali.map(r=>r.id));const f=S.materiali.slice().sort(byName).find(m=>!used.has(m.id))||S.materiali[0];draft.materiali.push({id:f.id,qta:1});reMod();break}
  case 'rmRow':readMod();draft.materiali.splice(+b.dataset.i,1);reMod();break;
  case 'step':{const k=b.dataset.k,dl=num(b.dataset.d);
    if(draft.kind==='mod'){readMod();if(k==='ore')draft.ore=Math.max(0,num(draft.ore)+dl);else{const r=draft.materiali[+k.slice(1)];r.qta=Math.max(0,Math.round((num(r.qta)+dl)*100)/100)}reMod()}
    else if(draft.kind==='spesa'){readCompra();const m=mat(draft.matId);const oldQ=draft.q;draft.q=Math.max(1,draft.q+dl);
      if(m&&Math.abs(draft.tot-num(m.prezzo)*oldQ)<.005)draft.tot=Math.round(num(m.prezzo)*draft.q*100)/100;drawCompra()}
    break}
  case 'useSug':readMod();draft.prezzo=num(b.dataset.v);reMod();break;
  case 'pickFoto':readMod();pickPhoto(url=>{if(draft&&draft.kind==='mod'){draft.foto=url;reMod()}});break;
  case 'noFoto':readMod();draft.foto='';reMod();break;
  case 'saveMod':{readMod();const d=draft;if(!d.nome.trim()){toast('Scrivi il nome della borsa');$('#fNome').focus();return}
    const o={id:d.id,nome:d.nome.trim(),foto:d.foto||'',ore:num(d.ore),prezzo:num(d.prezzo),note:d.note||'',vetrina:!!d.vetrina,materiali:d.materiali.filter(r=>num(r.qta)>0).map(r=>({id:r.id,qta:num(r.qta)}))};
    closeSheet();await put('modelli',o);toast('Borsa salvata');break}
  case 'delMod':closeSheet();await del('modelli',id);toast('Borsa eliminata');break;
  /* materials */
  case 'newMat':matForm(null);break;
  case 'editMat':matForm(mat(id));break;
  case 'pickTipo':readMat();draft.tipo=b.dataset.v;drawMat();break;
  case 'pickUn':readMat();draft.unita=b.dataset.v;drawMat();break;
  case 'saveMat':{readMat();const d=draft;if(!d.nome.trim()){toast('Scrivi il nome del materiale');return}
    closeSheet();await put('materiali',{id:d.id,nome:d.nome.trim(),tipo:d.tipo,unita:d.unita,prezzo:num(d.prezzo)});toast('Materiale salvato');break}
  case 'delMat':{closeSheet();await del('materiali',id);
    for(const m of S.modelli.filter(m=>(m.materiali||[]).some(r=>r.id===id))){await put('modelli',Object.assign({},m,{materiali:m.materiali.filter(r=>r.id!==id)}),true)}
    render();toast('Materiale eliminato');break}
  case 'compra':compraForm(mat(id),null);break;
  case 'editSpesa':{const s=S.spese.find(x=>x.id===id);if(s)compraForm(null,s);break}
  case 'saveSpesa':{readCompra();const d=draft;if(d.tot<=0){toast('Scrivi quanto hai speso');return}
    const o={id:d.id,materialeId:d.matId,nome:d.nome,unita:d.unita,quantita:d.q,totale:Math.round(d.tot*100)/100,data:d.data};
    const m=mat(d.matId),agg=d.isNew&&d.agg;closeSheet();await put('spese',o);
    if(agg&&m){const p=Math.round(d.tot/d.q*100)/100;if(Math.abs(p-num(m.prezzo))>=.01)await put('materiali',Object.assign({},m,{prezzo:p}))}
    toast('Acquisto segnato');break}
  case 'delSpesa':closeSheet();await del('spese',id);toast('Acquisto eliminato');break;
  /* bags made / sold */
  case 'finita':finitaForm();break;
  case 'pickFinita':{const m=mod(id);if(!m)return;closeSheet();
    await put('lavori',{id:uid('lav'),modelloId:m.id,nome:m.nome,costo:Math.round(costo(m)*100)/100,ore:num(m.ore),listino:num(m.prezzo),stato:'pronta',dataFine:today(),prezzo:0,dataVendita:'',cliente:''});
    UI.vend='pronte';render();toast('Brava! Borsa aggiunta a «Da vendere»');break}
  case 'vendi':{const l=S.lavori.find(x=>x.id===id);if(l)vendiForm(l);break}
  case 'saveVendi':{const l=S.lavori.find(x=>x.id===draft.id);if(!l)return;const p=num($('#fPrezzo').value);if(p<=0){toast('Scrivi il prezzo di vendita');return}
    const o=Object.assign({},l,{stato:'venduta',prezzo:p,cliente:$('#fCli').value.trim(),dataVendita:$('#fData').value||today()});closeSheet();await put('lavori',o);toast('Vendita segnata');break}
  case 'editLav':{const l=S.lavori.find(x=>x.id===id);if(l)lavForm(l);break}
  case 'saveLav':{const l=S.lavori.find(x=>x.id===draft.id);if(!l)return;const g=i=>document.getElementById(i);const o=Object.assign({},l,{dataFine:g('fFine').value||l.dataFine});
    if(l.stato==='venduta'){o.prezzo=num(g('fPrezzo').value);o.cliente=g('fCli').value.trim();o.dataVendita=g('fData').value||l.dataVendita}else o.listino=num(g('fList').value);
    closeSheet();await put('lavori',o);toast('Salvato');break}
  case 'unsell':{const l=S.lavori.find(x=>x.id===draft.id);if(!l)return;closeSheet();await put('lavori',Object.assign({},l,{stato:'pronta',prezzo:0,cliente:'',dataVendita:''}));toast('Tornata tra le borse da vendere');break}
  case 'delLav':closeSheet();await del('lavori',id);toast('Eliminata');break;
  /* settings */
  case 'saveImp':await putImp({nome:$('#impNome').value.trim()||'Le borse della mamma',tariffa:num($('#impTar').value)});toast('Impostazioni salvate');break;
  case 'export':{scarica('borse-copia-'+today()+'.json',new Blob([JSON.stringify(snapshot())],{type:'application/json'}));
    await putImp({ultimaCopia:today()});toast('Copia scaricata: la trovi nei Download');break}
  case 'csv':scarica('borse-movimenti-'+today()+'.csv',new Blob([csvMovimenti()],{type:'text/csv;charset=utf-8'}));toast('File CSV scaricato');break;
  case 'restoreAsk':openSheet(`<h2 id="sheetTitle">Tornare alla copia del ${fd(id.slice(6))}?</h2><p>Borse, materiali, acquisti e vendite torneranno com'erano quel giorno. Le modifiche fatte dopo andranno perse.</p>
    <div class="actions"><button class="btn primary big" data-act="restore" data-id="${esc(id)}">Sì, ripristina</button><button class="btn ghost" data-act="close">Annulla</button></div>`);break;
  case 'restore':{closeSheet();try{const d=await IDB.get(id);if(!d)throw 0;const keep=S.imp.ultimaCopia;apply(d);S.imp.ultimaCopia=keep;saveLocal();render();toast('Dati ripristinati')}catch(e){toast('Non riesco a leggere questa copia')}break}
  /* vetrina */
  case 'vetAdd':vetAddForm();break;
  case 'vetOpen':{const m=mod(id);if(!m)return;if(!m.foto){pickPhoto(async url=>{await put('modelli',Object.assign({},m,{foto:url}));vetOpen(mod(id))});return}vetOpen(m);break}
  case 'vetNew':pickPhoto(url=>{draft={kind:'vnew',foto:url,nome:draft&&draft.kind==='vnew'?($('#fNome')||{}).value:'',prezzo:draft&&draft.kind==='vnew'?($('#fPrezzo')||{}).value:''};vetNewForm()});break;
  case 'vetSaveNew':{const n=$('#fNome').value.trim(),p=num($('#fPrezzo').value);if(!n){toast('Scrivi il nome della borsa');$('#fNome').focus();return}
    const o={id:uid('mod'),nome:n,foto:draft.foto,ore:0,prezzo:p,note:'',materiali:[],vetrina:true};closeSheet();await put('modelli',o);toast('Borsa messa in vetrina');break}
  case 'vetPick':{const m=mod(id);if(!m)return;closeSheet();
    if(!m.foto){pickPhoto(async url=>{await put('modelli',Object.assign({},m,{foto:url,vetrina:true}));toast('Borsa messa in vetrina')});await put('modelli',Object.assign({},m,{vetrina:true}),true);render();return}
    await put('modelli',Object.assign({},m,{vetrina:true}));toast('Borsa messa in vetrina');break}
  case 'vetFoto':{const m=mod(id);if(!m)return;pickPhoto(async url=>{await put('modelli',Object.assign({},mod(id)||m,{foto:url}));vetOpen(mod(id))});break}
  case 'vetHide':{const m=mod(id);if(!m)return;closeSheet();await put('modelli',Object.assign({},m,{vetrina:false}));toast('Tolta dalla vetrina (resta tra le tue borse)');break}
  case 'share':{const m=mod(id);if(m)await condividi(m);break}
case 'import':$('#fileImport').click();break;
  case 'doImport':doImport();break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.matches('select[data-mi]')&&draft&&draft.kind==='mod'){readMod();reMod()}
  if(e.target.id==='fTot'&&draft&&draft.kind==='spesa'){draft.totTouched=true}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});

boot();
})();
</script>
